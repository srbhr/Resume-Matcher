name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build both architectures without logging in or publishing images
        type: boolean
        required: false
        default: false

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The Docker Hub token lives in this environment, which only main and
    # v*.*.* tags may deploy to, so no other branch can read it. A dry run
    # never logs in, so it skips the environment and can run on any branch.
    environment: ${{ !inputs.dry_run && 'dockerhub' || '' }}
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run && env.HAS_DOCKERHUB != '' }}
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/srbhr/resume-matcher
            ${{ env.HAS_DOCKERHUB != '' && 'srbhr/resume-matcher' || '' }}
          tags: |
            type=raw,value=validation-${{ github.sha }},enable=${{ inputs.dry_run == true }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ !inputs.dry_run }}
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
