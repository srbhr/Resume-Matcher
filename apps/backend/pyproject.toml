[project]
name = "rm-backend"
version = "1.4.0"
description = "Resume Matcher Backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "tinydb==4.9.0",
    "sqlalchemy[asyncio]==2.1.8",
    "aiosqlite==0.22.1",
    "psycopg[binary]==3.3.8",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
    "litellm==1.108.0",
    "markitdown[docx,pdf]==0.1.9",
    "pdfminer.six==20260107",
    "playwright==1.64.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "mcp==2.3.0",
]

[project.scripts]
app = "app.main:main"
resume-matcher-mcp = "app.mcp_server.server:main"
resume-matcher = "app.mcp_server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "respx==0.23.1",
    "ruff==0.17.3",
]
e2e-monitor = [
    "pypdf==6.21.4",  # PDF text probe for the non-blank render check
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# Code runs on Python 3.14. The ruff target stays py313 so the formatter keeps
# `except (A, B):`; py314 rewrites it to PEP 758's bare `except A, B:` repo-wide.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line length (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = [
    "E402",  # event loop policy configured before importing modules
]
"tests/*" = [
    "F811",  # redefinition of unused name (pytest fixtures)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# pytest-asyncio 1.x warns until this is set; "function" is its current default.
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "-v",
    # Exclude LLM-as-judge evals from the default run (they may call a real
    # provider and are non-deterministic). Run them on demand with `-m eval`.
    "-m",
    "not eval",
]
markers = [
    "unit: pure function tests, no external dependencies",
    "service: service layer tests with mocked LLM",
    "integration: API endpoint tests with httpx AsyncClient",
    "eval: prompt-quality evaluations; may call a real LLM, skipped without a configured key",
    "postgres: needs a PostgreSQL server; skipped without TEST_DATABASE_URL",
    "sqlite_only: exercises SQLite internals; skipped when TEST_DATABASE_URL is set",
]
